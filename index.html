<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerLoad Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>⚡ PowerLoad Planner</h1>
        <nav class="header-nav">
            <a href="index.html" class="btn active">Home</a>
            <a href="inventario-materiale.html" class="btn">Inventario Materiale</a>
            <a href="inventario-quadri.html" class="btn">Inventario Quadri</a>
            <a href="setup-progetto.html" class="btn">Crea Setup Evento</a>
            <a href="report.html" class="btn">Report Consumi</a>
            <a href="tabella.html" class="btn">Tabella Power Sheet</a>
            <a href="schema-unifilare.html" class="btn">Schema unifilare</a>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h2>Dati Progetto</h2>
            <form id="project-meta-form">
                <label for="projectName">Nome Progetto</label>
                <input type="text" id="projectName" placeholder="es. Concerto Piazza Maggiore">

                <label for="projectLocation">Luogo</label>
                <input type="text" id="projectLocation" placeholder="es. Bologna">

                <label for="projectVersion">Versione</label>
                <input type="text" id="projectVersion" placeholder="es. 1.0">
            </form>
        </section>

        <section class="card">
            <h2>Gestione Progetto</h2>
            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                <button id="save-project-btn" class="btn">Salva Progetto su File</button>
                <div>
                    <label for="load-project-input" class="btn btn-secondary" style="cursor: pointer;">Carica Progetto
                        da File</label>
                    <input type="file" id="load-project-input" accept=".json" style="display: none;">
                </div>
                <button id="new-project-btn" class="btn"
                    style="border-color: var(--danger-color); color: var(--danger-color);">Nuovo Progetto</button>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>

    <div class="version-footer">v0.7.2</div>
    <div class="credit-footer">Created by Roberto Chiartano</div>
</body>

</html>
