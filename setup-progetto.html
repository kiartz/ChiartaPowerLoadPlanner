<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Progetto - PowerLoad Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>📝 Setup Progetto</h1>
        <nav class="header-nav">
            <a href="index.html" class="btn">Home</a>
            <a href="inventario-materiale.html" class="btn">Inventario Materiale</a>
            <a href="inventario-quadri.html" class="btn">Inventario Quadri</a>
            <a href="setup-progetto.html" class="btn active">Crea Setup Evento</a>
            <a href="report.html" class="btn">Report Consumi</a>
            <a href="tabella.html" class="btn">Tabella Power Sheet</a>
            <a href="schema-unifilare.html" class="btn">Schema unifilare</a>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h2>Pannello di Controllo</h2>
            <button id="add-switchboard-btn" class="btn">Aggiungi Quadro Principale</button>
        </section>

        <div id="workspace">
        </div>
    </main>

    <div id="add-switchboard-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Seleziona un Template dall'Inventario</h2>
            <div id="inventory-switchboard-list"></div>
            <div class="modal-actions">
                <button type="button" id="cancel-add-sw-btn" class="btn btn-secondary">Annulla</button>
            </div>
        </div>
    </div>

    <div id="quick-add-material-modal" class="modal-overlay modal-overlay-top hidden">
        <div class="modal-content">
            <h2>Aggiungi Nuovo Materiale all'Inventario</h2>
            <form id="quick-add-material-form">
                <label for="quick-material-name">Nome Materiale</label>
                <input type="text" id="quick-material-name" placeholder="es. Faro LED 150W" required>
                <label for="quick-material-watts">Potenza (Watt)</label>
                <input type="number" id="quick-material-watts" min="0" required>
                <label for="quick-material-input-connection">Connessione di Input</label>
                <select id="quick-material-input-connection" required>
                    <option value="Monofase 220V 16A">Monofase 220V 16A</option>
                    <option value="Monofase 220V 32A">Monofase 220V 32A</option>
                    <option value="Pentapolare 380V 16A">Pentapolare 380V 16A</option>
                    <option value="Pentapolare 380V 32A">Pentapolare 380V 32A</option>
                    <option value="Pentapolare 380V 63A">Pentapolare 380V 63A</option>
                </select>
                <div class="modal-actions">
                    <button type="submit" class="btn">Salva Materiale</button>
                    <button type="button" id="cancel-quick-add-btn" class="btn btn-secondary">Annulla</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/core.js"></script>
    <script src="js/setup.js"></script>

    <div class="version-footer">v0.7.2</div>
    <div class="credit-footer">Created by Roberto Chiartano</div>
</body>

</html>
